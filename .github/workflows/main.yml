name: Create Glow for Facebook app

on:
  workflow_dispatch:
    inputs:

      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "Facebook"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.facebook.Facebook"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4.1.1
        with:
          path: main
          submodules: recursive

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: display_name,bundle_id

      - name: Download and validate IPA
        shell: bash
        run: |
          set -euo pipefail

          ipa_url="${{ inputs.ipa_url }}"
          ipa_path="${{ github.workspace }}/facebook.ipa"

          if [[ "$ipa_url" == *"drive.google.com"* ]]; then
            echo "Google Drive URL detected; using gdown to handle Drive confirmation pages."
            pipx run gdown "$ipa_url" -O "$ipa_path"
          else
            echo "Direct URL detected; downloading with curl."
            curl --fail --location --retry 3 --retry-delay 2 "$ipa_url" -o "$ipa_path"
          fi

          file_type=$(file --mime-type -b "$ipa_path")

          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

          if ! unzip -tq "$ipa_path" >/dev/null; then
            echo "::error::Validation failed: The downloaded file is not a readable IPA/ZIP archive."
            exit 1
          fi

          if unzip -Z1 "$ipa_path" | grep -Eq '^Payload/[^/]+\.app/Frameworks/(Glow|GlowCompat)\.dylib$'; then
            echo "::error::The input IPA already contains Glow or GlowCompat. Supply a clean decrypted IPA to avoid duplicate load commands."
            exit 1
          fi

      - name: Install Dependencies
        run: brew install make ldid-procursus

      - name: Set PATH environment variable
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Install Theos
        run: |
          set -euo pipefail
          export THEOS="$RUNNER_TEMP/theos"
          git clone --depth 1 --recurse-submodules https://github.com/theos/theos.git "$THEOS"
          xcrun --sdk iphoneos --show-sdk-path
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build GlowCompat
        run: |
          set -euo pipefail
          make -C main/GlowCompat ARCHS=arm64 FINALPACKAGE=1 clean all
          cp main/GlowCompat/.theos/obj/arm64/GlowCompat.dylib "$GITHUB_WORKSPACE/GlowCompat.dylib"

          compat_archs="$(lipo -archs "$GITHUB_WORKSPACE/GlowCompat.dylib" | tr -d '[:space:]')"
          if [[ "$compat_archs" != "arm64" ]]; then
            echo "::error::GlowCompat must contain only arm64; found: $compat_archs"
            exit 1
          fi
          echo "GlowCompat architectures=$compat_archs"
          build_info="$(xcrun vtool -show-build "$GITHUB_WORKSPACE/GlowCompat.dylib")"
          printf '%s\n' "$build_info"
          if ! grep -Eq 'minos[[:space:]]+15\.0' <<< "$build_info"; then
            echo "::error::GlowCompat must target iOS 15.0."
            exit 1
          fi
          python3 - "$GITHUB_WORKSPACE/GlowCompat.dylib" <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "main/scripts")
          from glow_macho import parse_macho, SECTION_TYPE, S_INIT_FUNC_OFFSETS

          S_MOD_INIT_FUNC_POINTERS = 0x9

          path = Path(sys.argv[1])
          meta = parse_macho(path.read_bytes())
          initializer_sections = [
              section for section in meta["sections"]
              if section["size"] > 0 and
              (section["flags"] & SECTION_TYPE) in
              (S_MOD_INIT_FUNC_POINTERS, S_INIT_FUNC_OFFSETS)
          ]
          if not initializer_sections:
              raise SystemExit("GlowCompat constructor/initializer section is missing.")

          for section in initializer_sections:
              print(
                  "GlowCompat initializer section="
                  f"{section['segment']},{section['name']} "
                  f"type=0x{section['flags'] & SECTION_TYPE:x} "
                  f"size={section['size']}"
              )
          PY
          compat_build_deps="$(otool -L "$GITHUB_WORKSPACE/GlowCompat.dylib")"
          if grep -Eiq 'CydiaSubstrate|libsubstrate' <<< "$compat_build_deps"; then
            echo "::error::GlowCompat must not depend on CydiaSubstrate or libsubstrate."
            exit 1
          fi
          if grep -Fq 'Glow.dylib' <<< "$compat_build_deps"; then
            echo "::error::GlowCompat must discover Glow dynamically, not link against Glow.dylib."
            exit 1
          fi

          compat_sha="$(shasum -a 256 "$GITHUB_WORKSPACE/GlowCompat.dylib" | awk '{print $1}')"
          echo "GlowCompat_0.1.0_arm64.dylib SHA-256=$compat_sha"
          echo "GLOWCOMPAT_SHA256=$compat_sha" >> "$GITHUB_ENV"

      - name: Build embedded late loader
        run: |
          set -euo pipefail
          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios15.0 \
            -c -Oz -Wall -Wextra -Werror -ffreestanding -fno-pic \
            -fno-stack-protector -fno-builtin -fno-unwind-tables \
            -fno-asynchronous-unwind-tables \
            main/GlowLateLoader/GlowLateLoader.c \
            -o "$GITHUB_WORKSPACE/GlowLateLoader.o"

          if strings -a "$GITHUB_WORKSPACE/GlowLateLoader.o" | grep -Eq 'GlowLateLoader-G2\.(status|error)'; then
            echo "::error::Production loader contains diagnostic filesystem strings."
            exit 1
          fi
          echo "GlowLateLoader object bytes=$(stat -f%z "$GITHUB_WORKSPACE/GlowLateLoader.o")"

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Download pinned Glow 1.3.1 arm64 package
        run: |
          set -euo pipefail
          tag_name="v1.3.1"
          deb_name="com.dvntm.glow_1.3.1_iphoneos-arm64.deb"
          deb_url="https://github.com/dayanch96/Glow/releases/download/${tag_name}/${deb_name}"
          wget "$deb_url" --no-verbose -O "$GITHUB_WORKSPACE/glow_fb.deb"
          expected_sha="c4e64385bdf471e74d3d65edf6e982bf3ac5613246f4368f90a3b262f1222847"
          actual_sha="$(shasum -a 256 "$GITHUB_WORKSPACE/glow_fb.deb" | awk '{print $1}')"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "::error::Glow 1.3.1 arm64 package checksum mismatch: $actual_sha"
            exit 1
          fi
          echo "GLOW_TAG=$tag_name" >> "$GITHUB_ENV"
          echo "Glow package SHA-256=$actual_sha"

      - name: Inject tweaks into IPA
        run: cyan -i facebook.ipa -o Glow_FB_${{ env.GLOW_TAG }}.ipa -u -w -e -f glow_fb.deb -n "${{ inputs.display_name }}" -b "${{ inputs.bundle_id }}" -s

      - name: Embed late-loaded Compat and patch Facebook executable
        env:
          GLOW_TEST_OBJECT: ${{ github.workspace }}/GlowLateLoader.o
        run: |
          set -euo pipefail
          ipa="$GITHUB_WORKSPACE/Glow_FB_${GLOW_TAG}.ipa"
          payload="$GITHUB_WORKSPACE/tmp_payload"
          rm -rf "$payload"
          mkdir -p "$payload"
          unzip -q "$ipa" -d "$payload"

          app_bundle="$(find "$payload/Payload" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_bundle" ]]; then
            echo "::error::No Facebook app bundle found after cyan injection."
            exit 1
          fi
          frameworks="$app_bundle/Frameworks"
          glow="$frameworks/Glow.dylib"
          compat="$frameworks/GlowCompat.dylib"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_bundle/Info.plist")"
          executable="$app_bundle/$executable_name"

          if [[ ! -f "$glow" || ! -f "$executable" ]]; then
            echo "::error::Glow or the Facebook executable is missing after cyan injection."
            exit 1
          fi
          if [[ -e "$compat" ]]; then
            echo "::error::GlowCompat was unexpectedly launch-injected by cyan."
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/GlowCompat.dylib" "$compat"
          ldid -S "$compat"

          baseline="$GITHUB_WORKSPACE/Facebook.prepatch.arm64"
          entitlements="$GITHUB_WORKSPACE/Facebook.entitlements.plist"
          cp "$executable" "$baseline"
          if ! ldid -e "$executable" > "$entitlements"; then
            echo "::error::Could not preserve Facebook executable entitlements before patching."
            exit 1
          fi

          GLOW_TEST_EXECUTABLE="$baseline" \
          GLOW_TEST_OBJECT="$GITHUB_WORKSPACE/GlowLateLoader.o" \
            python3 -m unittest discover -s main/tests -v

          patched="$GITHUB_WORKSPACE/Facebook.patched.arm64"
          python3 main/scripts/patch_glow_late_loader.py \
            "$executable" "$GITHUB_WORKSPACE/GlowLateLoader.o" "$patched" \
            | tee "$GITHUB_WORKSPACE/GlowPatch-report.json"
          mv "$patched" "$executable"
          ldid -S"$entitlements" "$executable"

          find "$app_bundle" -name 'libswift*.dylib' -print -delete
          clean_ipa="$GITHUB_WORKSPACE/Glow_FB_${GLOW_TAG}_clean.ipa"
          (cd "$payload" && zip -qr "$clean_ipa" Payload)
          mv "$clean_ipa" "$ipa"

          codesign --verify --strict "$executable"
          codesign --verify --strict "$glow"
          codesign --verify --strict "$compat"
          unzip -tq "$ipa"
          echo "GlowCompat remains file-only: $compat"
          echo "Facebook prepatch executable saved for preservation checks: $baseline"

      - name: Verify production IPA
        run: |
          set -euo pipefail
          python3 main/scripts/verify_glow_late_loader.py \
            "Glow_FB_${GLOW_TAG}.ipa" "$GITHUB_WORKSPACE/Facebook.prepatch.arm64" \
            | tee "$GITHUB_WORKSPACE/GlowFinal-verification.json"
          echo "Glow package input SHA-256=c4e64385bdf471e74d3d65edf6e982bf3ac5613246f4368f90a3b262f1222847"
          echo "GlowCompat build SHA-256=$GLOWCOMPAT_SHA256"
          echo "Final IPA SHA-256=$(shasum -a 256 "Glow_FB_${GLOW_TAG}.ipa" | awk '{print $1}')"

      - uses: softprops/action-gh-release@v2.0.1
        with:
          tag_name: glow-fb-${{ env.GLOW_TAG }}
          name: Glow_FB ${{ env.GLOW_TAG }}
          files: Glow_FB_${{ env.GLOW_TAG }}.ipa
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
